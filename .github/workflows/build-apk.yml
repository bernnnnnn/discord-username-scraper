name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the artifact
        id: apk
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          OUT="noctra-${GITHUB_SHA::7}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: noctra-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Noctra (latest build)
          body: |
            Debug-free release build of Noctra, signed with the repo keystore.
            Commit `${{ github.sha }}`.

            Download the `.apk` below and sideload it (Settings -> Apps -> Special access -> Install unknown apps).
          files: ${{ steps.apk.outputs.path }}
          prerelease: false
          make_latest: true
